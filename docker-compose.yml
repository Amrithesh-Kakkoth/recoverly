services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recoverly
      POSTGRES_PASSWORD: recoverly
      POSTGRES_DB: recoverly
    ports: ["${DB_PORT:-5432}:5432"]   # set DB_PORT if a local Postgres already uses 5432
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoverly"]
      interval: 2s
      timeout: 3s
      retries: 15
  app:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoverly:recoverly@db:5432/recoverly
      # PayPal sends the buyer back here after paying, so it must match the published port
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-8000}
    ports: ["${APP_PORT:-8000}:8000"]
    volumes: ["./backend:/srv"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://app:8000   # baked into the Next build: it proxies /api and /shop here
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [app]
volumes:
  pgdata:
