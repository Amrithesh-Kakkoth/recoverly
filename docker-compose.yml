services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: recoverly
      POSTGRES_PASSWORD: recoverly
      POSTGRES_DB: recoverly
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://recoverly:recoverly@db:5432/recoverly
    ports: ["8000:8000"]
    volumes: ["./backend:/srv", "./web:/web"]
    depends_on: [db]
volumes:
  pgdata:
