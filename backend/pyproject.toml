[project]
name = "recoverly"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
voice = ["pipecat-ai[webrtc,deepgram,cartesia,openai,silero,twilio]"]
paypal = ["paypal-agent-toolkit"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]   # evals/, scripts/ and tests/ are not part of the installed package

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
