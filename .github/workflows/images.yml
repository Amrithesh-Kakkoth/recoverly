name: Publish images

# Every commit on main gets images tagged with its SHA, so any of them can be deployed or rolled back to.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: app, context: backend, args: "" }
          # Baked in at build time; docker-compose.prod.yml gives the container this host name.
          - { service: web, context: web, args: "BACKEND_URL=http://host.docker.internal:8000" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.args }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/amrithesh-kakkoth/recoverly-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/amrithesh-kakkoth/recoverly-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
